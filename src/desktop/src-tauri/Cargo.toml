[package]
name = "wujin-bz-v3beta"
version = "4.0.7"
description = "无尽布阵工具 v3 — Tauri 2 桌面壳（布阵 + Agent 工作台）"
authors = ["MPZ 布阵工具工程"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wujin_bz_v3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wujin-bz-v3beta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

[profile.release]
strip = true
lto = "thin"
